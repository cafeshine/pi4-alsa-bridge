name: Inspect SOtM kernel SRPM

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/inspect-srpm.yml'

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq rpm cpio

      - name: Download SRPM
        run: |
          mkdir -p /tmp/srpm
          cd /tmp/srpm
          curl -L --retry 5 --retry-delay 10 --connect-timeout 30 \
            -o kernel.src.rpm \
            "https://sotm-audio.com/eunhasu/repo/releases/42/SRPMS/kernel-6.17.12-212.fc42.src.rpm"
          ls -lh kernel.src.rpm

      - name: Extract SRPM
        run: |
          cd /tmp/srpm
          rpm2cpio kernel.src.rpm | cpio -idm --quiet
          echo "=== key files ==="
          ls -lh kernel.spec patch-6.17-redhat.patch SOtM-*.patch 2>&1 || true

      - name: Show spec patch section
        run: |
          cd /tmp/srpm
          echo "=== patch definitions ==="
          grep -nE '^Patch[0-9]+:|patch-6\.17|SOtM|ApplyOptionalPatch|^%setup|^%patch' kernel.spec | head -100 || true
          echo "=== patch header ==="
          head -50 patch-6.17-redhat.patch || true

      - name: Inspect source tarball
        run: |
          mkdir -p /tmp/linux
          mkdir -p "$GITHUB_WORKSPACE/srpm-inspect"
          cd /tmp/linux
          echo "=== RT-related files in tarball ==="
          tar -tJf /tmp/srpm/linux-6.17.12.tar.xz | grep -E 'spinlock_rt|local_lock_rt|include/linux/module\.h$' | head -20 || true
          tar -xJf /tmp/srpm/linux-6.17.12.tar.xz --strip-components=1 linux-6.17.12/include/linux/module.h
          cp include/linux/module.h "$GITHUB_WORKSPACE/srpm-inspect/module.h"
          tar -xJf /tmp/srpm/linux-6.17.12.tar.xz --strip-components=1 linux-6.17.12/kernel/locking/spinlock_rt.c 2>/dev/null || true
          echo "=== extracted ==="
          ls -l include/linux/module.h kernel/locking/spinlock_rt.c 2>/dev/null || true
          echo "=== module.h struct module conditional fields ==="
          grep -nE 'CONFIG_(KALLSYMS|MODULE_UNLOAD|SMP|TRACEPOINTS|TREE_SRCU|BPF_EVENTS|DEBUG_INFO_BTF_MODULES|JUMP_LABEL|TRACING|EVENT_TRACING|DYNAMIC_FTRACE|KPROBES|HAVE_STATIC_CALL_INLINE|KUNIT|LIVEPATCH|PRINTK_INDEX|MODULES_TREE_LOOKUP|GENERIC_BUG|MODULE_SIG)' include/linux/module.h | head -80 || true

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/srpm-inspect"
          cp /tmp/srpm/kernel.spec "$GITHUB_WORKSPACE/srpm-inspect/" 2>/dev/null || true
          cp /tmp/srpm/patch-6.17-redhat.patch "$GITHUB_WORKSPACE/srpm-inspect/" 2>/dev/null || true
          cp /tmp/srpm/SOtM-*.patch "$GITHUB_WORKSPACE/srpm-inspect/" 2>/dev/null || true
          ls -lh "$GITHUB_WORKSPACE/srpm-inspect/"

      - uses: actions/upload-artifact@v4
        with:
          name: srpm-inspect
          path: srpm-inspect/
          if-no-files-found: warn
