name: Build alsa_bridge.ko — x86_64 XanMod RT (v3)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc clang lld llvm flex bison libelf-dev bc kmod dwarves \
            libssl-dev libncurses-dev

      - name: Clone XanMod RT kernel source
        run: |
          git clone --depth=1 -b 6.18-rt \
            https://gitlab.com/xanmod/linux.git /tmp/linux

      - name: Use target host kernel config
        working-directory: /tmp/linux
        run: |
          cp ${{ github.workspace }}/kernel-config-x64v3.config .config
          make olddefconfig
          # Verify critical configs
          echo "=== Key configs ==="
          grep -E "^CONFIG_(MODULES|SND_PCM|PREEMPT_RT|MODULE_SIG|CC_IS_CLANG|LD_IS_LLD)=" .config || true

      - name: Prepare kernel modules
        working-directory: /tmp/linux
        run: |
          make -j$(nproc) modules_prepare

      - name: Build alsa_bridge.ko
        run: |
          make -C /tmp/linux \
            ARCH=x86_64 \
            M=${{ github.workspace }}/DirettaAlsaHost \
            KBUILD_MODPOST_WARN=1 \
            modules

      - name: Verify module
        run: |
          echo "=== Module info ==="
          file DirettaAlsaHost/alsa_bridge.ko
          modinfo DirettaAlsaHost/alsa_bridge.ko || true
          echo "=== vermagic ==="
          strings DirettaAlsaHost/alsa_bridge.ko | grep "^vermagic=" || true
          echo "=== Size ==="
          ls -lh DirettaAlsaHost/alsa_bridge.ko

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: alsa_bridge-x64v3-6.18-rt-xanmod
          path: DirettaAlsaHost/alsa_bridge.ko
