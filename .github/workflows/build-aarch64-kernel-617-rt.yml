name: Build Pi4 aarch64 6.17.12 RT kernel (official Diretta Host vermagic)

on:
  workflow_dispatch:
    inputs:
      srpm_url:
        description: 'SOtM kernel SRPM URL'
        required: false
        default: 'https://sotm-audio.com/eunhasu/repo/releases/42/SRPMS/kernel-6.17.12-212.fc42.src.rpm'
      localversion:
        description: 'Kernel LOCALVERSION (must match official Diretta modules)'
        required: false
        default: '-212.fc42.aarch64'

env:
  KREL: 6.17.12-212.fc42.aarch64
  CROSS_COMPILE: aarch64-linux-gnu-

jobs:
  build-kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            gcc-aarch64-linux-gnu \
            bc flex bison libelf-dev libssl-dev kmod \
            cpio rpm aria2 xz-utils device-tree-compiler zstd file patch

      - name: Download SOtM kernel SRPM
        run: |
          mkdir -p /tmp/srpm
          cd /tmp/srpm
          aria2c -c -x 16 -s 16 -k 1M --file-allocation=none \
            -o kernel.src.rpm "${{ inputs.srpm_url }}" || \
          curl -L --retry 5 --retry-delay 10 -C - \
            -o kernel.src.rpm "${{ inputs.srpm_url }}"
          ls -lh kernel.src.rpm

      - name: Extract SRPM
        run: |
          cd /tmp/srpm
          rpm2cpio kernel.src.rpm | cpio -idm --quiet
          echo "=== SRPM contents (key files) ==="
          ls -lh linux-6.17.12.tar.xz kernel-aarch64-fedora.config patch-6.17-redhat.patch 2>&1 || true
          ls -lh | head -40

      - name: Extract kernel source and verify PREEMPT_RT
        run: |
          mkdir -p /tmp/linux
          tar -xJf /tmp/srpm/linux-6.17.12.tar.xz -C /tmp/linux --strip-components=1
          cd /tmp/linux
          head -5 Makefile
          if ! grep -q "PREEMPT_RT" kernel/Kconfig.preempt; then
            echo "Source is not RT-patched; trying patch-6.17-redhat.patch"
            patch -p1 --forward < /tmp/srpm/patch-6.17-redhat.patch
          fi
          grep -q "PREEMPT_RT" kernel/Kconfig.preempt
          echo "PREEMPT_RT source check: OK"

      - name: Build Pi4 config from 6.17 H6 base + 6.14 Pi4 fragment
        run: |
          cd /tmp/linux
          REPO="${{ github.workspace }}"
          cp "$REPO/scripts/config-6.17.12-212.fc42.aarch64" .config
          grep -E '^CONFIG_(ARCH_BCM2835|BCM2835|BCM2711|RASPBERRYPI|GPIO_RASPBERRYPI|PINCTRL_BCM2835|CLK_BCM2835|MMC_SDHCI_IPROC|MMC_SDHCI_IO_ACCESSORS|PCIE_BRCMSTB|USB_XHCI_PCI|USB_PCI|BCMGENET|NET_VENDOR_BROADCOM|DRM_VC4|DRM_V3D|SND_BCM2835|HW_RANDOM_BCM2835|I2C_BCM2835|SPI_BCM2835|DMA_BCM2835|RESET_RASPBERRYPI|CLK_RASPBERRYPI|RASPBERRYPI_POWER|PCI|PCI_HOST_COMMON|MAILBOX)' \
            "$REPO/scripts/config-6.14.0-63.fc42.aarch64" > /tmp/pi4.fragment
          sed -i 's/^CONFIG_MMC_SDHCI_IPROC=m/CONFIG_MMC_SDHCI_IPROC=y/' /tmp/pi4.fragment
          sed -i 's/^CONFIG_GPIO_RASPBERRYPI_EXP=m/CONFIG_GPIO_RASPBERRYPI_EXP=y/' /tmp/pi4.fragment
          sed -i 's/^CONFIG_BCMGENET=m/CONFIG_BCMGENET=y/' /tmp/pi4.fragment
          echo "=== Pi4 fragment ==="
          cat /tmp/pi4.fragment
          make ARCH=arm64 CROSS_COMPILE="${{ env.CROSS_COMPILE }}" scripts
          bash scripts/kconfig/merge_config.sh -m .config /tmp/pi4.fragment
          sed -i "s|^CONFIG_LOCALVERSION=.*|CONFIG_LOCALVERSION=\"${{ inputs.localversion }}\"|" .config
          make ARCH=arm64 CROSS_COMPILE="${{ env.CROSS_COMPILE }}" olddefconfig
          echo "=== key config ==="
          grep -E '^CONFIG_(PREEMPT_RT|SMP|MODULE_UNLOAD|ARCH_BCM2835|MMC_SDHCI_IPROC|PINCTRL_BCM2835|CLK_BCM2835|BCM2835_POWER|BCM2835_MBOX|RASPBERRYPI_FIRMWARE|GPIO_RASPBERRYPI_EXP|PCIE_BRCMSTB|USB_XHCI_PCI|BCMGENET|PCI|LOCALVERSION)=' .config
          grep -q '^CONFIG_PREEMPT_RT=y' .config
          grep -q '^CONFIG_ARCH_BCM2835=y' .config
          grep -q '^CONFIG_MMC_SDHCI_IPROC=y' .config
          grep -q '^CONFIG_GPIO_RASPBERRYPI_EXP=y' .config
          if grep -q '^CONFIG_MODVERSIONS=y' .config; then echo "MODVERSIONS must be off"; exit 1; fi

      - name: Build kernel, modules, dtbs
        run: |
          cd /tmp/linux
          make ARCH=arm64 CROSS_COMPILE="${{ env.CROSS_COMPILE }}" -j"$(nproc)" Image.gz modules dtbs
          KREL=$(make -s ARCH=arm64 CROSS_COMPILE="${{ env.CROSS_COMPILE }}" kernelrelease)
          echo "KREL=$KREL"
          test "$KREL" = "${{ env.KREL }}"
          echo "KERNEL_RELEASE=$KREL" >> "$GITHUB_ENV"

      - name: Verify module vermagic matches official Diretta Host
        run: |
          cd /tmp/linux
          KO=$(find . \( -name '*.ko' -o -name '*.ko.xz' -o -name '*.ko.zst' \) -print -quit)
          test -n "$KO"
          VM=$(modinfo -F vermagic "$KO")
          echo "module=$KO"
          echo "vermagic=$VM"
          test "$VM" = "${{ env.KREL }} SMP preempt_rt mod_unload aarch64"

      - name: Install modules and package
        run: |
          cd /tmp/linux
          KREL="${{ env.KERNEL_RELEASE }}"
          make ARCH=arm64 CROSS_COMPILE="${{ env.CROSS_COMPILE }}" \
            INSTALL_MOD_PATH="$PWD/output" modules_install
          depmod -b "$PWD/output" "$KREL"
          rm -f "output/lib/modules/$KREL/build" "output/lib/modules/$KREL/source"
          mkdir -p output/boot
          cp arch/arm64/boot/Image.gz "output/boot/Image-$KREL.gz"
          cp System.map "output/boot/System.map-$KREL"
          cp .config "output/boot/config-$KREL"
          DTB=$(find arch/arm64/boot/dts -name 'bcm2711-rpi-4-b.dtb' -print -quit)
          test -n "$DTB"
          cp "$DTB" output/boot/
          tar -C output -czf "/tmp/pi4-aarch64-kernel-$KREL.tar.gz" boot lib
          ls -lh "/tmp/pi4-aarch64-kernel-$KREL.tar.gz"
          find "output/lib/modules/$KREL" -name '*.ko*' | wc -l

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pi4-aarch64-kernel-${{ env.KERNEL_RELEASE }}
          path: /tmp/pi4-aarch64-kernel-${{ env.KERNEL_RELEASE }}.tar.gz
          retention-days: 30

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          KREL="${{ env.KERNEL_RELEASE }}"
          TAG="aarch64-kernel-$KREL"
          gh release create "$TAG" "/tmp/pi4-aarch64-kernel-$KREL.tar.gz" \
            --repo "${{ github.repository }}" \
            --title "Pi 4B aarch64 kernel $KREL (PREEMPT_RT)" \
            --notes "Pi 4B BCM2711 aarch64 kernel built from SOtM 6.17.12-212 SRPM with PREEMPT_RT. Module vermagic matches official Diretta Host: $KREL SMP preempt_rt mod_unload aarch64." \
            || echo "Release creation failed (may already exist); artifact is still uploaded"
